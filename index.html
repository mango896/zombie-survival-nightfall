<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>ZOMBIE SURVIVAL:NIGHTFALL</title>
    <link rel="stylesheet" href="styles.css">
    <style>body{margin:0;overflow:hidden;font-family:'Courier New',monospace}#gameCanvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%}#startScreen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,0.95);color:#00ff88;z-index:1000;text-align:center;padding:40px}.instructions{font-size:20px;margin:30px;line-height:1.8}h1.title{font-size:60px;color:#00ff88;text-shadow:0 0 20px #00ff88;margin-bottom:20px}button.start-btn{margin-top:30px;padding:20px 50px;font-size:24px;background:transparent;color:#00ff88;border:3px solid #00ff88;cursor:pointer;font-weight:bold;text-transform:uppercase;transition:all 0.3s}button.start-btn:hover{background:#00ff88;color:#000;box-shadow:0 0 30px #00ff88}</style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="uiLayer">
        <div id="hud" style="display:none;">
            <div class="hud-panel top-left">
                <span class="label">HEALTH:</span>
                <div class="health-bar"><div id="healthFill" class="health-fill"></div></div>
                <span id="healthText">100%</span>
            </div>
            <div class="hud-panel top-right"><span class="label">WEAPON:</span><span id="weaponName">ASSAULT RIFLE</span><span id="ammoDisplay">∞/∞</span></div>
            <div class="hud-panel center-left"><span class="label">WAVE:</span><span id="waveDisplay" style="color:#ff6666">1</span></div>
            <div class="hud-panel center-right"><span class="label">KILLS:</span><span id="killCount">0</span></div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
